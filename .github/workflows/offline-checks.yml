name: offline-checks

# 这个仓库的引擎本体编译需要 Siemens.Engineering.dll（要装 TIA Portal），
# GitHub 托管的 runner 上没有，所以**编译类 CI 在这里不可能有**。
# 这里跑的是不需要 TIA 的那几类检查：零依赖回归用例、面向调用方的文案一致性、
# 以及静默 catch 守卫。

on:
  push:
    branches: [master]
  pull_request:

jobs:
  offline-tests:
    # 回归套件是**控制台 Exe**，不是 VSTest 工程：
    # `dotnet test` 在它上面只会还原、一个用例都不跑、然后退 0 ——
    # 一个和「全部通过」长得一模一样的假绿灯。所以这里写死 `dotnet run`。
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Offline regression suite
        run: dotnet run --project tools/tiaportal-mcp/tests/TiaMcpServer.Tests/TiaMcpServer.Tests.csproj -c Release --nologo

  dead-tool-references:
    # 工具描述里点名的工具必须真的注册过。踩过的形状：某个能力被刻意下线了，
    # 但两条描述还写着 "use <那个工具>" —— AI 客户端照做只会撞 tool-not-found，
    # 然后自己去找别的路子绕。纯源码对拍，不需要装 TIA。
    # 脚本自带必错哨兵：闸门本身坏了会报 FAIL，而不是假 PASS。
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Descriptions must not name unregistered tools
        run: python3 scripts/Check-DeadToolReferences.py

  mcp-attribute-visibility:
    # 引擎不是靠人工登记，而是靠**反射扫描**把带 [McpServerTool] / [McpServerPrompt] /
    # [McpServerResource] 的成员捞出来的（Program.cs 的 WithPromptsFromAssembly()；
    # 工具侧是 McpServer.GetMcpToolNames() 的 BindingFlags.Public）。
    # 把这类成员收窄成 private **不会编译报错**，只会在运行时从 MCP 列表里静默消失 ——
    # 真踩过：一次「能收窄就收窄」的自动清理让 3 个 prompt 消失，而离线回归套件
    # 不覆盖 McpPrompts.cs，当时没有任何东西兜得住。
    # 脚本自带必错哨兵：注入一个 private 的特性方法，抓不到就报 FAIL，不给假 PASS。
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: MCP-attributed members must stay public
        run: python3 scripts/Check-McpAttributeVisibility.py

  silent-catch-guard:
    # 异常被吞掉属于「坏了也悄无声息」那一类：调用方只看到「没有」，看不到「失败」。
    # 本仓刚做过一轮 P0–P2（见 docs/try-catch_审计报告.md），Siemens 层已清零 ——
    # 但没有守卫它就会涨回来：同一个 Concat 修复被自动清理改回去过两次。
    # 只强制一条规则：空 catch 必须写明为什么可以吞。这条是实测选出来的 ——
    # 那轮修掉的 98 处静默 catch 全部能被它命中。
    # 存量已清零（P0–P2 一轮 + 烧基线一轮），所以现在没有基线文件、按零容忍跑。
    # 将来若要临时放行一批存量，用 -UpdateBaseline 生成 scripts/try-catch-baseline.txt，
    # 那时 CI 就只拦新增。
    # 脚本自带必错哨兵：闸门本身坏了会报 FAIL，而不是假 PASS。
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: No NEW silent catch blocks
        shell: pwsh
        run: ./scripts/Audit-TryCatch.ps1

  generated-matrix-in-sync:
    # 生成物必须能**重新生成得一模一样**，否则「文档」和「源码」就是两份各自漂移的东西。
    # 能力矩阵是纯源码静态抽取（不需要装 TIA，ubuntu 上 pwsh 就能跑），所以生成器坏掉
    # 和文档过期这两件事都能在这里被抓住 —— 本轮就是靠人肉才发现生成器早已解析不到任何
    # 工具（正则只认一种已经不用的写法），它抛错、而文档看上去一直正常。
    # 只比生成结果，不比时间戳那一行。
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: docs/tool-capability-matrix.md must match a fresh run
        shell: pwsh
        run: |
          $tmp = Join-Path ([System.IO.Path]::GetTempPath()) 'matrix-fresh.md'
          Remove-Item -LiteralPath $tmp -ErrorAction SilentlyContinue
          ./scripts/Generate-ToolCapabilityMatrix.ps1 -OutFile $tmp
          # 解析不到工具时脚本自己会 throw（那一处刚修过）；这里再兜一层「什么也没写出来」，
          # 免得坏掉的生成器把「没有输出」当成「没有差异」。
          if (-not (Test-Path -LiteralPath $tmp)) { throw "生成器没有写出文件：$tmp" }

          function Normalize([string]$path) {
            # 时间戳每次都不一样；换行按 LF 归一，免得 windows/linux 检出差异被当成文档过期。
            ((Get-Content -LiteralPath $path -Raw) -replace '(?m)^- 生成时间：.*$', '- 生成时间：<ignored>') `
              -replace "`r`n", "`n"
          }

          $fresh = Normalize $tmp
          $tracked = Normalize 'docs/tool-capability-matrix.md'
          if ($fresh -ne $tracked) {
            Write-Host "[FAIL] 文档与源码不一致 —— 本地跑 scripts/Generate-ToolCapabilityMatrix.ps1 后提交。" -ForegroundColor Red
            Compare-Object ($tracked -split "`n") ($fresh -split "`n") |
              Select-Object -First 20 | Format-Table -AutoSize | Out-String | Write-Host
            exit 1
          }
          Write-Host ("[PASS] 能力矩阵与源码一致（{0} 行）" -f ($fresh -split "`n").Count)
